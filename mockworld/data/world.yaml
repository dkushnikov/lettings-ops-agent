landlords:
  - id: L-001
    name: Mr Alan Foster
    email: alan.foster@example.com
    spend_cap_gbp: 250
    always_ask: false
    standing_instructions: >
      Routine repairs up to £250 may be authorised without contacting me.
      Anything above that, email me first with a quote. Prefer Hampton Plumbing
      (C-001) for plumbing and heating where they are available. Emergencies:
      act first, tell me straight after.
  - id: L-002
    name: Ms Helen Marsh
    email: helen.marsh@example.com
    spend_cap_gbp: 150
    always_ask: false
    standing_instructions: >
      Please keep costs down. Approve anything over £150 with me by email
      before booking. No non-urgent work at weekends. For genuine emergencies
      (gas, water, no heating in winter) go ahead and let me know.
  - id: L-003
    name: Sheen Property Holdings Ltd
    email: maintenance@sheenpropertyholdings.example.com
    spend_cap_gbp: 500
    always_ask: false
    standing_instructions: >
      Authorise repairs up to £500 without reference. Use contractors from the
      approved list only. Compliance renewals (gas safety, EICR) are to be
      booked automatically before expiry and the certificate uploaded to the
      property record.
  - id: L-004
    name: Dr Rachel Osei
    email: rachel.osei@example.com
    spend_cap_gbp: 0
    always_ask: true
    standing_instructions: >
      I want to be consulted on all works regardless of value. The only
      exception is a genuine emergency where the tenant's safety or health is
      at risk: in that case act first and telephone me immediately afterwards.
      Mrs Hughes is elderly; please treat any loss of heating or hot water as
      urgent.

